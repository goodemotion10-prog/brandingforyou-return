<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600;700;900&family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />

<style>
  :root {
    /* default scheme — Charcoal × Refined Gold */
    --bg:        #F2EEE6;
    --bg-alt:    #E6E0D2;
    --paper:     #FBF9F4;
    --ink:       #1C1A17;
    --ink-2:     #4A4842;
    --muted:     #8A8780;
    --line:      #D8D1C0;
    --gold:      #B89968;
    --gold-deep: #8C6D40;
    --gold-soft: #E8DDC4;

    /* Tweakable type family */
    --font-display: "Noto Serif KR", "Gowun Batang", serif;
    --font-body:    "Pretendard", "IBM Plex Sans KR", system-ui, sans-serif;
    --font-mono:    "IBM Plex Mono", monospace;
  }

  * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    font-feature-settings: "ss01", "cv11";
    text-wrap: pretty;
    line-height: 1.55;
  }
  .display {
    font-family: var(--font-display);
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.05;
  }
  .mono { font-family: var(--font-mono); letter-spacing: 0; }
  ::selection { background: var(--gold); color: var(--ink); }
  a { color: inherit; }
  button { font: inherit; cursor: pointer; }
  img { max-width: 100%; display: block; }

  .container { max-width: 1280px; margin: 0 auto; padding: 0 32px; }
  @media (max-width: 720px) { .container { padding: 0 20px; } }

  /* reveal on scroll — transform-only so content stays visible even when transitions are throttled */
  .reveal { opacity: 1; transform: translateY(14px); transition: transform .7s cubic-bezier(.2,.7,.2,1); }
  .reveal.in { transform: none; }
  @media (prefers-reduced-motion: reduce) { .reveal { transform: none !important; transition: none !important; } }

  /* link defaults */
  a { text-underline-offset: 4px; text-decoration-thickness: 1px; }

  /* simple focus ring */
  input:focus, select:focus, textarea:focus, button:focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: 2px;
  }
</style>
</head>
<body>

<div id="root"></div>

  ]
}/*EDITMODE-END*/
</script>
